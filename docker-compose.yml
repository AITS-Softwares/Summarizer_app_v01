services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SummaryStudio_Dev123!}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: ./backend/Summarizer.Api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SummarizerApp;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SummaryStudio_Dev123!};TrustServerCertificate=True"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Storage__FilesPath: "/data/files"
      Storage__DataProtectionPath: "/data/keys"
    ports:
      - "5036:8080"
    volumes:
      - app-storage:/data
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  app-storage:
